<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>Geometry Neon Dash: 20 Stages - WHY GAMES</title>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; user-select: none; -webkit-user-select: none; }
  body, html { width: 100%; height: 100%; overflow: hidden; background: #05050d; font-family: 'Poppins', system-ui, sans-serif; }
  #gameCanvas { display: block; width: 100vw; height: 100vh; object-fit: contain; }

  .back-btn {
    position: absolute;
    top: 12px;
    left: 12px;
    background: rgba(18, 20, 32, 0.85);
    border: 1px solid #4a5568;
    color: #fff;
    padding: 6px 14px;
    border-radius: 8px;
    font-size: 13px;
    font-weight: bold;
    text-decoration: none;
    z-index: 50;
  }

  .top-hud {
    position: absolute;
    top: 12px;
    right: 14px;
    display: flex;
    gap: 10px;
    z-index: 50;
  }
  .hud-badge {
    background: rgba(15, 23, 42, 0.9);
    border: 1px solid #38bdf8;
    color: #facc15;
    font-size: 13px;
    font-weight: 800;
    padding: 6px 12px;
    border-radius: 20px;
  }
  .hud-stage {
    background: rgba(15, 23, 42, 0.9);
    border: 1px solid #a855f7;
    color: #38bdf8;
    font-size: 13px;
    font-weight: 800;
    padding: 6px 12px;
    border-radius: 20px;
  }
  .shop-btn-top {
    background: linear-gradient(135deg, #a855f7, #ec4899);
    border: none;
    color: #fff;
    font-size: 13px;
    font-weight: 800;
    padding: 6px 14px;
    border-radius: 20px;
    cursor: pointer;
  }

  /* Modals */
  #shopModal, #gameOverModal, #stageClearModal, #stageSelectModal {
    display: none;
    position: absolute;
    top: 50%;
    left: 50%;
    transform: translate(-50%, -50%);
    width: 90%;
    max-width: 480px;
    background: rgba(10, 12, 22, 0.98);
    border: 2px solid #a855f7;
    border-radius: 18px;
    padding: 20px;
    color: #fff;
    text-align: center;
    box-shadow: 0 0 35px rgba(168, 85, 247, 0.4);
    z-index: 100;
  }

  .shop-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; margin: 15px 0; }
  .shop-card {
    background: #171b2e;
    border: 1px solid #334155;
    padding: 10px;
    border-radius: 12px;
    font-size: 12px;
  }
  .legendary { border-color: #facc15; background: linear-gradient(135deg, #2a2010, #171b2e); }

  .level-grid {
    display: grid;
    grid-template-columns: repeat(5, 1fr);
    gap: 8px;
    margin: 15px 0;
    max-height: 240px;
    overflow-y: auto;
  }
  .lvl-btn {
    background: #1e293b;
    border: 1px solid #475569;
    color: #fff;
    padding: 10px 0;
    border-radius: 8px;
    font-weight: 800;
    font-size: 14px;
    cursor: pointer;
  }
  .lvl-btn.active { border-color: #38bdf8; color: #38bdf8; }
  .lvl-btn.locked { opacity: 0.4; cursor: not-allowed; }

  .btn-action {
    background: #38bdf8;
    color: #000;
    border: none;
    padding: 6px;
    width: 100%;
    border-radius: 6px;
    font-weight: bold;
    margin-top: 6px;
    cursor: pointer;
  }
  .btn-ad {
    background: linear-gradient(135deg, #a855f7, #6366f1);
    color: #fff;
  }

  .modal-btn {
    background: #22c55e;
    border: none;
    color: #fff;
    padding: 10px 24px;
    border-radius: 8px;
    font-weight: bold;
    font-size: 14px;
    margin-top: 10px;
    cursor: pointer;
    width: 100%;
  }
  .close-btn { background: #ef4444; }
  .select-lvl-btn { background: #3b82f6; }
</style>
</head>
<body>

<a href="index.html" class="back-btn">⬅ WHY GAMES</a>

<div class="top-hud">
  <div class="hud-stage" onclick="openLevelSelect()" style="cursor:pointer;">LEVEL <span id="stageNum">1</span>/20 ▾</div>
  <div class="hud-badge">⭐ <span id="starCounter">20</span></div>
  <button class="shop-btn-top" onclick="toggleShop(true)">🛍️ SKINS</button>
</div>

<canvas id="gameCanvas" width="900" height="500"></canvas>

<!-- Customization Shop -->
<div id="shopModal">
  <h2 style="color:#facc15; font-size:20px;">LEGENDARY CUBE VAULT</h2>
  <div class="shop-grid">
    <div class="shop-card">
      <div style="font-size:24px;">🟩</div>
      <h4>Neon Classic</h4>
      <p style="color:#38bdf8;">Default</p>
      <button class="btn-action" onclick="equipSkin('classic')">Equip</button>
    </div>
    <div class="shop-card legendary">
      <div style="font-size:24px;">🔥</div>
      <h4 style="color:#facc15;">Flame Demon</h4>
      <p style="color:#facc15;">30 Stars</p>
      <button class="btn-action" onclick="buySkin('flame', 30)">Unlock</button>
    </div>
    <div class="shop-card legendary">
      <div style="font-size:24px;">👑</div>
      <h4 style="color:#facc15;">Golden Matrix</h4>
      <p style="color:#4ade80;">VIP Reward</p>
      <button class="btn-action btn-ad" onclick="watchAdReward('gold_skin')">📺 Unlock via Ad</button>
    </div>
    <div class="shop-card">
      <div style="font-size:24px;">⭐</div>
      <h4>Star Stash</h4>
      <p style="color:#4ade80;">+50 Stars</p>
      <button class="btn-action btn-ad" onclick="watchAdReward('stars')">📺 Watch for Stars</button>
    </div>
  </div>
  <button class="modal-btn close-btn" onclick="toggleShop(false)">RESUME RUN</button>
</div>

<!-- Level Select Modal -->
<div id="stageSelectModal">
  <h2 style="color:#38bdf8; font-size:20px;">SELECT LEVEL (1 - 20)</h2>
  <div class="level-grid" id="levelContainer"></div>
  <button class="modal-btn close-btn" onclick="document.getElementById('stageSelectModal').style.display='none'">CLOSE</button>
</div>

<!-- Game Over -->
<div id="gameOverModal">
  <h2 style="color:#ef4444; font-size:26px;">CRASHED!</h2>
  <p style="margin: 8px 0; font-size:13px; color:#94a3b8;" id="progressPercent">Attempt: 45% Cleared</p>
  <button class="modal-btn" style="background:linear-gradient(135deg, #a855f7, #6366f1);" onclick="watchAdReward('revive')">⚡ Watch Ad to Revive Here</button>
  <button class="modal-btn" onclick="restartLevel()">Try Again</button>
  <button class="modal-btn select-lvl-btn" onclick="openLevelSelect()">Choose Level</button>
</div>

<!-- Stage Clear -->
<div id="stageClearModal">
  <h2 style="color:#22c55e; font-size:26px;">STAGE CLEARED! 🎉</h2>
  <p style="margin: 10px 0; font-size:14px;" id="clearMsg">Level 1 Complete! +15 Stars Earned.</p>
  <button class="modal-btn" onclick="nextStage()">NEXT LEVEL ➔</button>
</div>

<script>
const canvas = document.getElementById('gameCanvas');
const ctx = canvas.getContext('2d');

const AD_SMARTLINK = "https://auctionr.org/4/0ecf866196856ac93826c721e0c25524";

// Audio
const audioCtx = new (window.AudioContext || window.webkitAudioContext)();
function playBeep(freq, type='square', duration=0.08) {
  try {
    const osc = audioCtx.createOscillator();
    const gain = audioCtx.createGain();
    osc.type = type;
    osc.frequency.setValueAtTime(freq, audioCtx.currentTime);
    gain.gain.setValueAtTime(0.15, audioCtx.currentTime);
    gain.gain.exponentialRampToValueAtTime(0.01, audioCtx.currentTime + duration);
    osc.connect(gain);
    gain.connect(audioCtx.destination);
    osc.start();
    osc.stop(audioCtx.currentTime + duration);
  } catch(e){}
}

const GROUND_Y = 380;
const CUBE_SIZE = 34;

const player = {
  x: 120, y: GROUND_Y - CUBE_SIZE, size: CUBE_SIZE,
  vy: 0, gravity: 0.92, jumpForce: -13.8,
  isGrounded: true, rotation: 0,
  skin: 'classic', stars: 20
};

let currentLevel = 1;
let unlockedLevel = 20;
let obstacles = [];
let particles = [];
let speed = 6;
let distance = 0;
let trackLength = 3200;
let gameOver = false;
let isShopOpen = false;

// 20 Stages Setup
function initTrack(lvl) {
  obstacles = [];
  distance = 0;
  player.y = GROUND_Y - CUBE_SIZE;
  player.vy = 0;
  player.rotation = 0;
  gameOver = false;
  document.getElementById('stageNum').innerText = lvl;

  speed = 5.8 + (lvl * 0.2);
  trackLength = 2600 + (lvl * 250);

  let currentX = 550;
  while(currentX < trackLength) {
    const gap = Math.max(170, 310 - (lvl * 5) + Math.random() * 70);
    currentX += gap;
    const rand = Math.random();

    if(lvl <= 5) {
      if(rand < 0.65) {
        obstacles.push({ x: currentX, y: GROUND_Y - 34, w: 34, h: 34, type: 'spike' });
      } else {
        obstacles.push({ x: currentX, y: GROUND_Y - 34, w: 34, h: 34, type: 'block' });
      }
    } else if(lvl <= 12) {
      if(rand < 0.45) {
        // Double spike
        obstacles.push({ x: currentX, y: GROUND_Y - 34, w: 34, h: 34, type: 'spike' });
        obstacles.push({ x: currentX + 34, y: GROUND_Y - 34, w: 34, h: 34, type: 'spike' });
      } else if(rand < 0.75) {
        obstacles.push({ x: currentX, y: GROUND_Y - 34, w: 34, h: 34, type: 'block' });
        obstacles.push({ x: currentX + 85, y: GROUND_Y - 34, w: 34, h: 34, type: 'spike' });
      } else {
        obstacles.push({ x: currentX, y: GROUND_Y - 70, w: 60, h: 22, type: 'block' });
      }
    } else {
      // Hard: Triple spikes & rapid rhythm
      if(rand < 0.45) {
        obstacles.push({ x: currentX, y: GROUND_Y - 34, w: 34, h: 34, type: 'spike' });
        obstacles.push({ x: currentX + 34, y: GROUND_Y - 34, w: 34, h: 34, type: 'spike' });
        obstacles.push({ x: currentX + 68, y: GROUND_Y - 34, w: 34, h: 34, type: 'spike' });
      } else if(rand < 0.8) {
        obstacles.push({ x: currentX, y: GROUND_Y - 34, w: 34, h: 34, type: 'block' });
        obstacles.push({ x: currentX + 34, y: GROUND_Y - 34, w: 34, h: 34, type: 'block' });
        obstacles.push({ x: currentX + 75, y: GROUND_Y - 34, w: 34, h: 34, type: 'spike' });
      } else {
        obstacles.push({ x: currentX, y: GROUND_Y - 34, w: 34, h: 34, type: 'spike' });
        obstacles.push({ x: currentX + 65, y: GROUND_Y - 65, w: 45, h: 20, type: 'block' });
      }
    }
  }
}
initTrack(currentLevel);

function jump() {
  if(audioCtx.state === 'suspended') audioCtx.resume();
  if(gameOver || isShopOpen) return;

  if(player.isGrounded) {
    player.vy = player.jumpForce;
    player.isGrounded = false;
    playBeep(420, 'triangle', 0.12);
  }
}

window.addEventListener('keydown', (e) => { if(e.code === 'Space') jump(); });
window.addEventListener('touchstart', (e) => {
  if(!e.target.closest('button') && !e.target.closest('a') && !e.target.closest('#shopModal') && !e.target.closest('#gameOverModal') && !e.target.closest('#stageSelectModal') && !e.target.closest('#stageClearModal')) {
    jump();
  }
});
window.addEventListener('mousedown', (e) => {
  if(!e.target.closest('button') && !e.target.closest('a') && !e.target.closest('#shopModal') && !e.target.closest('#gameOverModal') && !e.target.closest('#stageSelectModal') && !e.target.closest('#stageClearModal')) {
    jump();
  }
});

function toggleShop(open) {
  isShopOpen = open;
  document.getElementById('shopModal').style.display = open ? 'block' : 'none';
}

function equipSkin(s) {
  player.skin = s;
  alert("Skin Equipped!");
}

function buySkin(s, cost) {
  if(player.stars >= cost) {
    player.stars -= cost;
    player.skin = s;
    updateStarUI();
    alert("Unlocked & Equipped!");
  } else {
    alert("Not enough stars! Watch an ad to get +50 stars.");
  }
}

function updateStarUI() {
  document.getElementById('starCounter').innerText = player.stars;
}

function openLevelSelect() {
  const container = document.getElementById('levelContainer');
  container.innerHTML = '';
  for(let i=1; i<=20; i++) {
    const btn = document.createElement('button');
    btn.className = `lvl-btn ${i === currentLevel ? 'active' : ''} ${i > unlockedLevel ? 'locked' : ''}`;
    btn.innerText = i;
    btn.onclick = () => {
      if(i <= unlockedLevel) {
        currentLevel = i;
        document.getElementById('stageSelectModal').style.display = 'none';
        document.getElementById('gameOverModal').style.display = 'none';
        initTrack(currentLevel);
      }
    };
    container.appendChild(btn);
  }
  document.getElementById('stageSelectModal').style.display = 'block';
}

function nextStage() {
  document.getElementById('stageClearModal').style.display = 'none';
  if(currentLevel < 20) {
    currentLevel++;
    unlockedLevel = Math.max(unlockedLevel, currentLevel);
  }
  initTrack(currentLevel);
}

function restartLevel() {
  document.getElementById('gameOverModal').style.display = 'none';
  document.getElementById('stageClearModal').style.display = 'none';
  initTrack(currentLevel);
}

function watchAdReward(type) {
  window.open(AD_SMARTLINK, '_blank');
  setTimeout(() => {
    if(type === 'stars') {
      player.stars += 50;
      updateStarUI();
      alert("Reward: +50 Stars Added!");
    } else if(type === 'gold_skin') {
      player.skin = 'gold';
      alert("Legendary Golden Matrix Skin Unlocked!");
    } else if(type === 'revive') {
      document.getElementById('gameOverModal').style.display = 'none';
      player.y = GROUND_Y - CUBE_SIZE;
      player.vy = 0;
      gameOver = false;
      alert("Revived!");
    }
  }, 700);
}

function spawnSparks(x, y, color) {
  for(let i=0; i<10; i++) {
    particles.push({
      x, y,
      vx: (Math.random() - 0.5) * 8,
      vy: (Math.random() - 0.5) * 8,
      color, life: 18
    });
  }
}

function update() {
  if(gameOver || isShopOpen || document.getElementById('stageClearModal').style.display === 'block') return;

  distance += speed;

  // Jump physics
  player.vy += player.gravity;
  player.y += player.vy;

  if(player.y >= GROUND_Y - CUBE_SIZE) {
    player.y = GROUND_Y - CUBE_SIZE;
    player.vy = 0;
    player.isGrounded = true;
    player.rotation = Math.round(player.rotation / (Math.PI / 2)) * (Math.PI / 2);
  } else {
    player.rotation += 0.13;
  }

  // Particle Trail
  if(Math.random() < 0.6) {
    const col = player.skin === 'flame' ? '#f97316' : (player.skin === 'gold' ? '#facc15' : '#00f2fe');
    particles.push({ x: player.x, y: player.y + player.size - 4, vx: -speed + 1, vy: (Math.random()-0.5)*2, color: col, life: 12 });
  }

  // Obstacle Collision
  obstacles.forEach(obs => {
    obs.x -= speed;

    // Pixel-perfect Hitbox (Spikes are strictly ABOVE ground)
    const pLeft = player.x + 6;
    const pRight = player.x + player.size - 6;
    const pTop = player.y + 4;
    const pBottom = player.y + player.size;

    const oLeft = obs.x + 4;
    const oRight = obs.x + obs.w - 4;
    const oTop = obs.y + 4;
    const oBottom = obs.y + obs.h;

    if(pRight > oLeft && pLeft < oRight && pBottom > oTop && pTop < oBottom) {
      playBeep(120, 'sawtooth', 0.2);
      spawnSparks(player.x + 18, player.y + 18, '#ff3b3b');
      gameOver = true;
      const pct = Math.min(99, Math.floor((distance / trackLength) * 100));
      document.getElementById('progressPercent').innerText = `Stage ${currentLevel}: ${pct}% Cleared`;
      document.getElementById('gameOverModal').style.display = 'block';
    }
  });

  // Particles
  particles.forEach((p, pi) => {
    p.x += p.vx; p.y += p.vy; p.life--;
    if(p.life <= 0) particles.splice(pi, 1);
  });

  // Stage Clear Condition
  if(distance >= trackLength && !gameOver) {
    player.stars += 15 + Math.floor(currentLevel * 1.5);
    updateStarUI();
    document.getElementById('clearMsg').innerText = `Level ${currentLevel} Complete! +${15 + Math.floor(currentLevel * 1.5)} Stars.`;
    document.getElementById('stageClearModal').style.display = 'block';
  }
}

function draw() {
  ctx.fillStyle = '#090a14';
  ctx.fillRect(0, 0, 900, 500);

  // Dynamic Grid shifts by stage
  ctx.strokeStyle = currentLevel > 12 ? '#3b0764' : '#1e1b4b';
  ctx.lineWidth = 1;
  const gridShift = distance % 40;
  for(let x = -gridShift; x < 900; x += 40) { ctx.beginPath(); ctx.moveTo(x, 0); ctx.lineTo(x, 500); ctx.stroke(); }
  for(let y = 0; y < 500; y += 40) { ctx.beginPath(); ctx.moveTo(0, y); ctx.lineTo(900, y); ctx.stroke(); }

  // Solid Floor (Under ground line)
  ctx.fillStyle = '#0f172a';
  ctx.fillRect(0, GROUND_Y, 900, 500 - GROUND_Y);

  // Floor Edge Line
  ctx.strokeStyle = currentLevel > 12 ? '#ef4444' : '#00f2fe';
  ctx.lineWidth = 3;
  ctx.beginPath(); 
  ctx.moveTo(0, GROUND_Y); 
  ctx.lineTo(900, GROUND_Y); 
  ctx.stroke();

  // Progress Bar
  const progPct = Math.min(1, distance / trackLength);
  ctx.fillStyle = 'rgba(255,255,255,0.1)';
  ctx.fillRect(220, 16, 460, 8);
  ctx.fillStyle = '#22c55e';
  ctx.fillRect(220, 16, 460 * progPct, 8);

  particles.forEach(p => {
    ctx.fillStyle = p.color;
    ctx.fillRect(p.x, p.y, 4, 4);
  });

  // Obstacles Rendered EXACTLY on top of GROUND_Y
  obstacles.forEach(obs => {
    if(obs.x > -60 && obs.x < 960) {
      if(obs.type === 'spike') {
        // Neon Red Triangle resting perfectly on the floor
        ctx.fillStyle = '#ef4444';
        ctx.strokeStyle = '#fca5a5';
        ctx.lineWidth = 2;
        ctx.beginPath();
        ctx.moveTo(obs.x, GROUND_Y);
        ctx.lineTo(obs.x + (obs.w / 2), GROUND_Y - obs.h);
        ctx.lineTo(obs.x + obs.w, GROUND_Y);
        ctx.closePath();
        ctx.fill();
        ctx.stroke();

        // Inner glowing core
        ctx.fillStyle = '#ff8888';
        ctx.beginPath();
        ctx.moveTo(obs.x + 6, GROUND_Y);
        ctx.lineTo(obs.x + (obs.w / 2), GROUND_Y - obs.h + 8);
        ctx.lineTo(obs.x + obs.w - 6, GROUND_Y);
        ctx.closePath();
        ctx.fill();
      } else {
        ctx.fillStyle = '#6366f1';
        ctx.strokeStyle = '#c7d2fe';
        ctx.lineWidth = 2;
        ctx.fillRect(obs.x, obs.y, obs.w, obs.h);
        ctx.strokeRect(obs.x, obs.y, obs.w, obs.h);
      }
    }
  });

  // Player Cube
  ctx.save();
  ctx.translate(player.x + player.size / 2, player.y + player.size / 2);
  ctx.rotate(player.rotation);

  if(player.skin === 'flame') {
    ctx.fillStyle = '#f97316';
    ctx.fillRect(-player.size/2, -player.size/2, player.size, player.size);
    ctx.strokeStyle = '#facc15';
    ctx.lineWidth = 3;
    ctx.strokeRect(-player.size/2, -player.size/2, player.size, player.size);
    ctx.fillStyle = '#000';
    ctx.fillRect(3, -6, 5, 5);
  } else if(player.skin === 'gold') {
    ctx.fillStyle = '#facc15';
    ctx.fillRect(-player.size/2, -player.size/2, player.size, player.size);
    ctx.strokeStyle = '#ffffff';
    ctx.lineWidth = 3;
    ctx.strokeRect(-player.size/2, -player.size/2, player.size, player.size);
    ctx.fillStyle = '#78350f';
    ctx.fillRect(3, -6, 5, 5);
  } else {
    ctx.fillStyle = '#22c55e';
    ctx.fillRect(-player.size/2, -player.size/2, player.size, player.size);
    ctx.strokeStyle = '#38bdf8';
    ctx.lineWidth = 3;
    ctx.strokeRect(-player.size/2, -player.size/2, player.size, player.size);
    ctx.fillStyle = '#000';
    ctx.fillRect(3, -6, 5, 5);
  }
  ctx.restore();
}

function loop() {
  update();
  draw();
  requestAnimationFrame(loop);
}
loop();
</script>
</body>
</html>

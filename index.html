<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>WHY GAMES | Ultimate Online Arcade</title>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; font-family: 'Poppins', system-ui, sans-serif; }
  
  body {
    background: radial-gradient(circle at top, #2b1055, #0a071b 80%);
    color: #ffffff;
    min-height: 100vh;
    padding-bottom: 60px;
    display: flex;
    flex-direction: column;
    align-items: center;
  }

  header {
    width: 100%;
    background: rgba(255, 255, 255, 0.04);
    backdrop-filter: blur(12px);
    -webkit-backdrop-filter: blur(12px);
    border-bottom: 1px solid rgba(255, 255, 255, 0.1);
    padding: 22px 20px;
    text-align: center;
    box-shadow: 0 8px 32px rgba(0, 0, 0, 0.3);
  }

  .logo-box {
    display: inline-flex;
    align-items: center;
    gap: 10px;
    background: linear-gradient(90deg, #ff007f, #7928ca);
    padding: 6px 18px;
    border-radius: 30px;
    box-shadow: 0 0 20px rgba(255, 0, 127, 0.5);
  }

  h1 {
    font-size: 26px;
    font-weight: 900;
    letter-spacing: 2px;
    text-transform: uppercase;
    color: #ffffff;
    text-shadow: 0 2px 8px rgba(0, 0, 0, 0.4);
  }

  p.tagline {
    color: #e0d4fc;
    font-size: 13px;
    margin-top: 10px;
    font-weight: 500;
  }

  .container {
    width: 90%;
    max-width: 960px;
    margin-top: 35px;
  }

  .section-title {
    font-size: 20px;
    font-weight: 800;
    letter-spacing: 1px;
    text-transform: uppercase;
    color: #00f2fe;
    display: flex;
    align-items: center;
    gap: 8px;
    margin-bottom: 20px;
  }

  .game-grid {
    display: grid;
    grid-template-columns: repeat(auto-fit, minmax(260px, 1fr));
    gap: 25px;
  }

  .game-card {
    background: rgba(255, 255, 255, 0.05);
    border: 1px solid rgba(255, 255, 255, 0.15);
    border-radius: 20px;
    overflow: hidden;
    box-shadow: 0 15px 35px rgba(0, 0, 0, 0.4);
    transition: transform 0.25s ease, border-color 0.25s ease;
  }

  .game-card:hover {
    transform: translateY(-6px);
    border-color: #00f2fe;
  }

  .card-banner {
    height: 140px;
    background: linear-gradient(135deg, #ff007f, #4facfe);
    display: flex;
    align-items: center;
    justify-content: center;
    font-size: 48px;
    text-shadow: 0 5px 15px rgba(0,0,0,0.3);
  }

  .card-body {
    padding: 20px;
    text-align: left;
  }

  .badge {
    display: inline-block;
    background: rgba(0, 242, 254, 0.2);
    color: #00f2fe;
    font-size: 11px;
    font-weight: 700;
    padding: 4px 10px;
    border-radius: 20px;
    margin-bottom: 10px;
    border: 1px solid rgba(0, 242, 254, 0.4);
  }

  .card-title {
    font-size: 20px;
    font-weight: 800;
    color: #ffffff;
    margin-bottom: 6px;
  }

  .card-desc {
    font-size: 13px;
    color: #c4b5fd;
    line-height: 1.5;
    margin-bottom: 20px;
  }

  .btn-group {
    display: flex;
    gap: 10px;
  }

  .btn {
    flex: 1;
    padding: 12px 0;
    border-radius: 12px;
    font-weight: 700;
    font-size: 13px;
    text-align: center;
    text-decoration: none;
    cursor: pointer;
    transition: 0.2s;
  }

  .btn-play {
    background: linear-gradient(135deg, #00f2fe, #4facfe);
    color: #040d21;
    box-shadow: 0 4px 15px rgba(0, 242, 254, 0.4);
  }

  .btn-play:active {
    transform: scale(0.96);
  }

  .btn-apk {
    background: rgba(255, 255, 255, 0.08);
    color: #ffffff;
    border: 1px solid rgba(255, 255, 255, 0.2);
  }

  .btn-apk:active {
    background: rgba(255, 255, 255, 0.15);
  }

  footer {
    margin-top: 50px;
    color: #8b7cb6;
    font-size: 12px;
  }
</style>
</head>
<body>

<header>
  <div class="logo-box">
    <h1>WHY GAMES</h1>
  </div>
  <p class="tagline">⚡ Next-Gen Free Web Games & Mobile APKs</p>
</header>

<div class="container">
  <div class="section-title">🔥 Featured Releases</div>
  
  <div class="game-grid">
    
    <!-- Stickman Legend Card -->
    <div class="game-card">
      <div class="card-banner">🥊⚡</div>
      <div class="card-body">
        <span class="badge">ACTION / FIGHTING</span>
        <div class="card-title">Stickman Legend</div>
        <div class="card-desc">Fight waves of enemies, defeat massive bosses, collect gold coins, and unlock plasma rifles in the armory!</div>
        <div class="btn-group">
          <a href="stickman.html" class="btn btn-play">Play Now</a>
          <a href="https://drive.google.com/uc?export=download&id=1zsgDeRAosCyBrY-0mjMCS7kwgocXlGi5" target="_blank" class="btn btn-apk">Get APK</a>
        </div>
      </div>
    </div>

  </div>
</div>

<footer>
  <p>© 2026 WHY GAMES • Built for Players</p>
</footer>

</body>
</html>
